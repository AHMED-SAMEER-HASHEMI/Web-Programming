<!DOCTYPE html>
<html>
<head>
<title>Lab 5 - Activity 4</title>
<style>
  body { background: #c8c8c8; font-family: Arial, sans-serif; }
  table.signup { background: #3b4a54; margin: 30px auto; color: white; width: 600px; }
  .fb { background: #3b5998; color: white; text-align: center; padding: 10px; }
  .tw { background: #55acee; color: white; text-align: center; padding: 10px; }
  .signup input[type=text], .signup input[type=password] {
    background: white; border: none; padding: 10px; width: 95%;
  }
  .create { background: #3fa76d; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; }
  .signup a { color: #55acee; }
</style>
</head>
<body>

<form onsubmit="return validateForm()">
<table class="signup" cellpadding="10">
  <tr>
    <td class="fb">Connect with Facebook</td>
    <td class="tw">Connect with Twitter</td>
  </tr>
  <tr><td colspan="2" align="center">Or sign up with</td></tr>
  <tr>
    <td><input type="text" id="fname" placeholder="First Name"></td>
    <td><input type="text" id="lname" placeholder="Last Name"></td>
  </tr>
  <tr>
    <td colspan="2"><input type="text" id="email" placeholder="your@email.com"></td>
  </tr>
  <tr>
    <td colspan="2"><input type="password" id="password" placeholder="Password"></td>
  </tr>
  <tr>
    <td colspan="2">By creating an account, you agree to our <a href="#">Terms &amp; Conditions</a></td>
  </tr>
  <tr>
    <td colspan="2"><input type="submit" class="create" value="Create account"></td>
  </tr>
</table>
</form>

<script>
function validateForm() {
  var fname = document.getElementById("fname").value.trim();
  var lname = document.getElementById("lname").value.trim();
  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;

  if (fname === "") {
    alert("Please enter your first name.");
    return false;
  }
  if (lname === "") {
    alert("Please enter your last name.");
    return false;
  }
  if (email === "" || email.indexOf("@") === -1 || email.indexOf(".") === -1) {
    alert("Please enter a valid email address.");
    return false;
  }
  if (password.length < 6) {
    alert("Password must be at least 6 characters long.");
    return false;
  }

  alert("Signup successful!");
  return true;
}
</script>

</body>
</html>
