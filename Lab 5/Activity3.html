<!DOCTYPE html>
<html>
<head>
<title>Lab 5 - Activity 3</title>
</head>
<body>
<h2>Activity 3: Repeat a Message</h2>

<script>
var times = Number(prompt("Enter a number:"));
var message = prompt("Enter a message:");

for (var i = 1; i <= times; i++) {
  document.write(i + ". " + message + "<br>");
}
</script>
</body>
</html>
