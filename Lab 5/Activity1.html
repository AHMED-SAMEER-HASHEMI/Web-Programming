<!DOCTYPE html>
<html>
<head>
<title>Lab 5 - Activity 1</title>
</head>
<body>
<h2>Activity 1: Sum of Numbers</h2>
<p>Refresh the page to run again.</p>

<script>
var sum = 0;
var num = Number(prompt("Enter a number (enter 0 to finish):"));

while (num !== 0) {
  sum = sum + num;
  num = Number(prompt("Enter a number (enter 0 to finish):"));
}

document.write("<h3>The sum is: " + sum + "</h3>");
</script>
</body>
</html>
