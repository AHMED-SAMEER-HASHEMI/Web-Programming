<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>
</head>

<body style="margin:0; font-family:Arial, sans-serif;">

    <!-- TOP GREY AREA -->
    <div style="
        height:120px;
        background-color:#b8d8c6;
        text-align:center;
        padding-top:25px;">

        <span style="
            display:inline-block;
            background-color:#d9f1df;
            border:2px solid #526b5c;
            padding:15px 30px;
            font-size:24px;
            font-weight:bold;
            color:#33443a;">

            Lab Task 1 

        </span>

    </div>


    <!-- MAIN BLACK AREA -->
    <div style="
        width:90%;
        margin:auto;
        min-height:600px;
        background-color:#202b2e;
        padding:75px 10%;
        box-sizing:border-box;">


        <!-- FACEBOOK AND TWITTER -->
        <table style="
            width:100%;
            border-collapse:collapse;">

            <tr>

                <td style="
                    height:55px;
                    background-color:#3b5998;
                    text-align:center;">

                    <a href="https://www.facebook.com/"
                       target="_blank"
                       style="
                       color:white;
                       text-decoration:none;
                       font-weight:bold;">

                        Connect with Facebook

                    </a>

                </td>


                <td style="
                    height:55px;
                    background-color:#55acee;
                    text-align:center;">

                    <a href="https://twitter.com/"
                       target="_blank"
                       style="
                       color:white;
                       text-decoration:none;
                       font-weight:bold;">

                        Connect with Twitter

                    </a>

                </td>

            </tr>

        </table>


        <!-- SIGN UP TEXT -->
        <p style="
            text-align:center;
            color:white;
            margin:15px 0;">

            or sign up with

        </p>


        <!-- FORM -->
        <form>

            <table style="
                width:100%;
                border-collapse:separate;
                border-spacing:0 20px;">


                <!-- FIRST NAME AND LAST NAME -->
                <tr>

                    <td style="
                        width:50%;
                        padding-right:2px;">

                        <input type="text"
                               placeholder="First Name"
                               required
                               style="
                               width:100%;
                               height:55px;
                               border:none;
                               padding:15px;
                               box-sizing:border-box;
                             
                               font-size:16px;">

                    </td>


                    <td style="
                        width:50%;
                        padding-left:2px;">

                        <input type="text"
                               placeholder="Last Name"
                               required
                               style="
                               width:100%;
                               height:55px;
                               border:none;
                               padding:15px;
                               box-sizing:border-box;
                              
                               font-size:16px;">

                    </td>

                </tr>


                <!-- EMAIL -->
                <tr>

                    <td colspan="2">

                        <input type="email"
                               placeholder="your@email.com"
                               required
                               style="
                               width:100%;
                               height:55px;
                               border:none;
                               padding:15px;
                               box-sizing:border-box;
                               background-color:white;
                               font-size:16px;">

                    </td>

                </tr>


                <!-- PASSWORD -->
                <tr>

                    <td colspan="2">

                        <input type="password"
                               placeholder="Password"
                               required
                               style="
                               width:100%;
                               height:55px;
                               border:none;
                               padding:15px;
                               box-sizing:border-box;
                            
                               font-size:16px;">

                    </td>

                </tr>

            </table>


            <!-- TERMS AND CONDITIONS -->
            <p style="
                color:#b9c1c2;
                font-size:14px;">

                By creating an account, you agree to our

                <a href="#terms"
                   style="
                   color:#55acee;
                   text-decoration:none;">

                    Terms & Conditions

                </a>

            </p>


            <!-- CREATE ACCOUNT BUTTON -->
            <button type="submit"
                    style="
                    width:100%;
                    height:60px;
                    border:none;
                    background-color:#4caf50;
                    color:white;
                    font-size:18px;
                    cursor:pointer;">

                Create account

            </button>


        </form>


        <!-- FOOTER -->
        <div style="
            text-align:center;
            color:#b9c1c2;
            margin-top:35px;
            font-size:14px;">

            Template by Colorlib

        </div>

    </div>

    <div id="terms" style="
        background-color:#eeeeee;
        padding:40px;
        color:#333;">

    </div>

</body>
</html>
